[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "humanoid-mujoco"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mujoco>=3.5.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["humanoid_mujoco"]

[tool.pytest.ini_options]
testpaths = ["tests"]
